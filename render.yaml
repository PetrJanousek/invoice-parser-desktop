# Render deploy config (infrastructure-as-code).
# Push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render reads this file and provisions the web service. Set the secret env
# vars (marked sync:false) in the dashboard after the first deploy.
services:
  - type: web
    name: invoice-parser
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      # Pin Python: Render defaults to the latest (3.14), which has no prebuilt
      # pydantic-core wheel and fails building it from Rust source on Render's
      # read-only FS. 3.12 matches local dev and has wheels for all deps.
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: LLM_PROVIDER
        value: anthropic          # production default; not the local ollama
      - key: LLM_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY        # only needed if LLM_PROVIDER=google (Gemini)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_BATCH_CAP
        value: "20"
